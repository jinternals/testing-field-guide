name: flake-hunt          # run one test class many times, on several machines, to catch a rare failure
on:
  workflow_dispatch:
    inputs:
      module: { description: 'Maven project folder', default: 'spring-ops' }
      test:   { description: 'Integration test class (Failsafe -Dit.test)', default: 'PriceCacheIT' }
      runs:   { description: 'Runs per machine', default: '10' }
permissions: { contents: read }
jobs:
  repeat:
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { machine: [1, 2, 3] } }
    defaults: { run: { shell: bash, working-directory: '${{ inputs.module }}' } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B -ntp -q test-compile
      - name: Repeat
        env: { TEST: '${{ inputs.test }}', RUNS: '${{ inputs.runs }}' }
        run: |
          fails=0
          for i in $(seq "$RUNS"); do
            if ! mvn -B -ntp verify -Dit.test="$TEST" -Dtest=NoUnit \
              -Dsurefire.failIfNoSpecifiedTests=false > run.log 2>&1; then
              fails=$((fails+1))
              msg=$(grep -E "<<< FAIL|Expecting|Wanted|But was|at shop\.|expected|but was" run.log | grep -v "^\s*at org" | head -25 | awk '{printf "%s%%0A", $0}')
              echo "::warning title=run $i failed::$msg"     # shown on the run's summary page
            fi
          done
          echo "::notice title=result::$fails of $RUNS runs failed"
