name: flake-hunt          # temporary: repeat PriceCacheIT to find a rare failure
on: [push]
permissions: { contents: read }
jobs:
  repeat:
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { n: [1, 2, 3] } }
    defaults: { run: { shell: bash, working-directory: spring-ops } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B -ntp -q test-compile
      - name: 10 runs
        run: |
          fails=0
          for i in $(seq 10); do
            if ! mvn -B -ntp verify -Dit.test=PriceCacheIT -Dtest=NoUnit -Dsurefire.failIfNoSpecifiedTests=false > run.log 2>&1; then
              fails=$((fails+1))
              msg=$(grep -E "<<< FAIL|Expecting|Wanted|But was|at shop\.|expected|but was" run.log | grep -v "^\s*at org" | head -25 | awk '{printf "%s%%0A", $0}')
              echo "::warning title=run $i failed::$msg"
            fi
          done
          echo "::notice title=result::$fails of 10 runs failed"
