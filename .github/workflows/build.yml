name: build
on: [push, workflow_dispatch]
permissions:
  contents: write              # only to publish the logs branch

jobs:
  maven:
    runs-on: ubuntu-latest
    defaults: { run: { shell: 'bash -eo pipefail {0}' } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mkdir -p logs && java -version 2>&1 | tee logs/java.txt && mvn -v | tee logs/mvn.txt && nproc | tee logs/nproc.txt && docker version --format '{{.Server.Version}}' | tee logs/docker.txt
      - run: docker pull -q postgres:17-alpine   # so both timed runs start warm
      - name: Unit (threads) + integration (forks) + coverage
        run: mvn -B -ntp verify 2>&1 | tee logs/maven-verify.log
      - name: Time the integration tests with 1 and 2 JVMs (twice each)
        run: |
          TS="-Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS"
          for f in 2 1 2 1; do
            echo "### it.forks=$f" | tee -a logs/maven-timing.log
            t0=$(date +%s%3N)
            mvn -B -ntp $TS verify -Dit.forks=$f 2>&1 | grep -E "failsafe:|Tests run: [0-9]+, Fail.*$|\[fork|BUILD" | tee -a logs/maven-timing.log
            echo "wall: $(( $(date +%s%3N) - t0 )) ms" | tee -a logs/maven-timing.log
          done
      - name: Copy-paste detection, tests included
        continue-on-error: true      # expected to find duplicates
        run: mvn -B -ntp generate-test-sources pmd:cpd-check 2>&1 | tee logs/maven-cpd.log
      - name: Mutation testing + duplicate-test finder
        run: mvn -B -ntp test-compile pitest:mutationCoverage exec:java 2>&1 | tee logs/maven-pit.log
      - name: Publish logs
        if: always()
        run: |
          cp -r target/site/jacoco logs/jacoco 2>/dev/null || true
          cp target/pit-reports/mutations.xml logs/ 2>/dev/null || true
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs-maven && git rm -rqf --cached . && git add -f logs && git commit -qm "Maven logs ${GITHUB_SHA::7}" && git push -fq origin ci-logs-maven

  gradle:
    runs-on: ubuntu-latest
    defaults: { run: { shell: 'bash -eo pipefail {0}' } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v6
      - run: mkdir -p logs
      - name: Unit (threads) + integration (forks) + coverage
        run: ./gradlew --console=plain --warning-mode all test integrationTest jacocoTestReport 2>&1 | tee logs/gradle-verify.log
      - name: Copy-paste detection, tests included
        continue-on-error: true      # expected to find duplicates
        run: ./gradlew --console=plain --warning-mode all cpdCheck 2>&1 | tee logs/gradle-cpd.log
      - name: Mutation testing + duplicate-test finder
        run: ./gradlew --console=plain --warning-mode all pitest findRedundantTests 2>&1 | tee logs/gradle-pit.log
      - name: Build cache - the same tests twice after a clean
        run: |
          for i in 1 2; do
            echo "### run $i: gradle clean test --build-cache" | tee -a logs/gradle-cache.log
            ./gradlew --console=plain --build-cache clean test 2>&1 | grep -E "Task :(compileJava|compileTestJava|test)|BUILD|actionable" | tee -a logs/gradle-cache.log
          done
      - name: Publish logs
        if: always()
        run: |
          cp -r build/reports/cpd logs/cpd 2>/dev/null || true
          cp -r build/test-results logs/test-results 2>/dev/null || true
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs-gradle && git rm -rqf --cached . && git add -f logs && git commit -qm "Gradle logs ${GITHUB_SHA::7}" && git push -fq origin ci-logs-gradle

  spring:
    runs-on: ubuntu-latest
    defaults: { run: { shell: 'bash -eo pipefail {0}', working-directory: spring } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mkdir -p logs
      - name: Spring Boot slice + full-context tests (Testcontainers)
        run: mvn -B -ntp verify 2>&1 | tee logs/spring-verify.log
      - name: Library versions managed by Spring Boot
        if: always()
        run: mvn -B -ntp -q dependency:list -DoutputFile=logs/spring-deps.txt -DincludeScope=test
      - name: Publish logs
        if: always()
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs-spring && git rm -rqf --cached .. && git add -f logs && git commit -qm "Spring logs ${GITHUB_SHA::7}" && git push -fq origin ci-logs-spring

  extras:
    runs-on: ubuntu-latest
    defaults: { run: { shell: 'bash -eo pipefail {0}' } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mkdir -p logs
      - name: Legacy, Kafka, extensions, logs/metrics, AWS + Azure
        working-directory: extras
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: mvn -B -ntp verify 2>&1 | tee ../logs/extras-verify.log
      - name: Mock auth server (in-process and container)
        if: always()
        working-directory: spring-auth
        run: mvn -B -ntp verify 2>&1 | tee ../logs/auth-verify.log
      - name: Publish logs
        if: always()
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs-extras && git rm -rqf --cached . && git add -f logs && git commit -qm "Extras logs ${GITHUB_SHA::7}" && git push -fq origin ci-logs-extras

  shard:
    runs-on: ubuntu-latest
    strategy:
      matrix: { shard: [1, 2] }       # two machines, half the classes each
    defaults: { run: { shell: 'bash -eo pipefail {0}' } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v6
      - name: Run this shard's test classes
        run: |
          mkdir -p logs
          classes=$(cd src/test/java && find . -name '*Test.java' \
            | sed 's#^./##; s#.java$##; s#/#.#g' | sort \
            | awk -v n=2 -v k=${{ matrix.shard }} 'NR % n == k % n')
          echo "shard ${{ matrix.shard }}/2: $(echo $classes | wc -w) classes" | tee logs/shard.log
          ./gradlew --console=plain test $(printf -- '--tests %s ' $classes) 2>&1 | tail -3 | tee -a logs/shard.log
          python3 - <<'PY' | tee -a logs/shard.log
          import glob, xml.etree.ElementTree as ET
          n = sum(int(ET.parse(f).getroot().get("tests")) for f in glob.glob("build/test-results/test/*.xml"))
          print(f"tests run in this shard: {n}")
          PY
      - name: Publish logs
        if: always()
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs-shard-${{ matrix.shard }} && git rm -rqf --cached . && git add -f logs && git commit -qm "Shard logs ${GITHUB_SHA::7}" && git push -fq origin ci-logs-shard-${{ matrix.shard }}
