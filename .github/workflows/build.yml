name: build
on: [push, workflow_dispatch]
permissions:
  contents: write              # only to publish the logs branch

jobs:
  maven:
    runs-on: ubuntu-latest
    defaults: { run: { shell: 'bash -eo pipefail {0}' } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mkdir -p logs && java -version 2>&1 | tee logs/java.txt && mvn -v | tee logs/mvn.txt && nproc | tee logs/nproc.txt && docker version --format '{{.Server.Version}}' | tee logs/docker.txt
      - run: docker pull -q postgres:17-alpine   # so both timed runs start warm
      - name: Unit (threads) + integration (forks) + coverage
        run: mvn -B -ntp verify 2>&1 | tee logs/maven-verify.log
      - name: Time the integration tests with 1 and 2 JVMs (twice each)
        run: |
          TS="-Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS"
          for f in 2 1 2 1; do
            echo "### it.forks=$f" | tee -a logs/maven-timing.log
            t0=$(date +%s%3N)
            mvn -B -ntp $TS verify -Dit.forks=$f 2>&1 | grep -E "failsafe:|Tests run: [0-9]+, Fail.*$|\[fork|BUILD" | tee -a logs/maven-timing.log
            echo "wall: $(( $(date +%s%3N) - t0 )) ms" | tee -a logs/maven-timing.log
          done
      - name: Copy-paste detection, tests included
        continue-on-error: true      # expected to find duplicates
        run: mvn -B -ntp generate-test-sources pmd:cpd-check 2>&1 | tee logs/maven-cpd.log
      - name: Mutation testing + duplicate-test finder
        run: mvn -B -ntp test-compile pitest:mutationCoverage exec:java 2>&1 | tee logs/maven-pit.log
      - name: Publish logs
        if: always()
        run: |
          cp -r target/site/jacoco logs/jacoco 2>/dev/null || true
          cp target/pit-reports/mutations.xml logs/ 2>/dev/null || true
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs-maven && git rm -rqf --cached . && git add -f logs && git commit -qm "Maven logs ${GITHUB_SHA::7}" && git push -fq origin ci-logs-maven

  gradle:
    runs-on: ubuntu-latest
    defaults: { run: { shell: 'bash -eo pipefail {0}' } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v6
      - run: mkdir -p logs
      - name: Unit (threads) + integration (forks) + coverage
        run: ./gradlew --console=plain --warning-mode all test integrationTest jacocoTestReport 2>&1 | tee logs/gradle-verify.log
      - name: Copy-paste detection, tests included
        continue-on-error: true      # expected to find duplicates
        run: ./gradlew --console=plain --warning-mode all cpdCheck 2>&1 | tee logs/gradle-cpd.log
      - name: Mutation testing + duplicate-test finder
        run: ./gradlew --console=plain --warning-mode all pitest findRedundantTests 2>&1 | tee logs/gradle-pit.log
      - name: Publish logs
        if: always()
        run: |
          cp -r build/reports/cpd logs/cpd 2>/dev/null || true
          cp -r build/test-results logs/test-results 2>/dev/null || true
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs-gradle && git rm -rqf --cached . && git add -f logs && git commit -qm "Gradle logs ${GITHUB_SHA::7}" && git push -fq origin ci-logs-gradle
