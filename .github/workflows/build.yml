name: build
on: [push, workflow_dispatch]
permissions:
  contents: write              # only to publish the logs branches and the PDF on main

jobs:
  maven:
    runs-on: ubuntu-latest
    defaults: { run: { shell: 'bash -eo pipefail {0}' } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mkdir -p logs && java -version 2>&1 | tee logs/java.txt && mvn -v | tee logs/mvn.txt && nproc | tee logs/nproc.txt && docker version --format '{{.Server.Version}}' | tee logs/docker.txt
      - run: docker pull -q postgres:17-alpine   # so both timed runs start warm
      - name: Unit (threads) + integration (forks) + coverage
        run: mvn -B -ntp verify 2>&1 | tee logs/maven-verify.log
      - name: Time the integration tests with 1 and 2 JVMs (twice each)
        run: |
          TS="-Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS"
          for f in 2 1 2 1; do
            echo "### it.forks=$f" | tee -a logs/maven-timing.log
            t0=$(date +%s%3N)
            mvn -B -ntp $TS verify -Dit.forks=$f 2>&1 | grep -E "failsafe:|Tests run: [0-9]+, Fail.*$|\[fork|BUILD" | tee -a logs/maven-timing.log
            echo "wall: $(( $(date +%s%3N) - t0 )) ms" | tee -a logs/maven-timing.log
          done
      - name: Copy-paste detection, tests included
        continue-on-error: true      # expected to find duplicates
        run: mvn -B -ntp generate-test-sources pmd:cpd-check 2>&1 | tee logs/maven-cpd.log
      - name: Mutation testing + duplicate-test finder
        run: mvn -B -ntp test-compile pitest:mutationCoverage exec:java 2>&1 | tee logs/maven-pit.log
      - name: Collect reports
        if: always()
        run: |
          cp -r target/site/jacoco logs/jacoco 2>/dev/null || true
          cp target/pit-reports/mutations.xml logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@v7      # this run's logs, for the guide job
        if: always()
        with: { name: logs-maven, path: logs }
      - name: Publish logs to the ci-logs-maven branch
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs-maven && git rm -rqf --cached . && git add -f logs && git commit -qm "Maven logs ${GITHUB_SHA::7}" && git push -fq origin ci-logs-maven

  gradle:
    runs-on: ubuntu-latest
    defaults: { run: { shell: 'bash -eo pipefail {0}' } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v6
      - run: mkdir -p logs
      - name: Unit (threads) + integration (forks) + coverage
        run: ./gradlew --console=plain --warning-mode all test integrationTest jacocoTestReport 2>&1 | tee logs/gradle-verify.log
      - name: Copy-paste detection, tests included
        continue-on-error: true      # expected to find duplicates
        run: ./gradlew --console=plain --warning-mode all cpdCheck 2>&1 | tee logs/gradle-cpd.log
      - name: Mutation testing + duplicate-test finder
        run: ./gradlew --console=plain --warning-mode all pitest findRedundantTests 2>&1 | tee logs/gradle-pit.log
      - name: Keep the reports (the cache runs below start with clean)
        if: always()
        run: |
          cp -r build/reports/cpd logs/cpd 2>/dev/null || true
          cp -r build/test-results logs/test-results 2>/dev/null || true
      - name: Build cache - the same tests without and with the cache
        run: |
          for c in --no-build-cache --build-cache; do
            echo "### gradle clean test $c" | tee -a logs/gradle-cache.log
            ./gradlew --console=plain $c clean test 2>&1 | grep -E "Task :(compileJava|compileTestJava|test)|BUILD|actionable" | tee -a logs/gradle-cache.log
          done
      - uses: actions/upload-artifact@v7      # this run's logs, for the guide job
        if: always()
        with: { name: logs-gradle, path: logs }
      - name: Publish logs to the ci-logs-gradle branch
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs-gradle && git rm -rqf --cached . && git add -f logs && git commit -qm "Gradle logs ${GITHUB_SHA::7}" && git push -fq origin ci-logs-gradle

  spring:
    runs-on: ubuntu-latest
    defaults: { run: { shell: 'bash -eo pipefail {0}', working-directory: spring } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mkdir -p logs
      - name: Spring Boot slice + full-context tests (Testcontainers)
        run: mvn -B -ntp verify 2>&1 | tee logs/spring-verify.log
      - name: Library versions managed by Spring Boot
        if: always()
        run: mvn -B -ntp -q dependency:list -DoutputFile=logs/spring-deps.txt -DincludeScope=test
      - uses: actions/upload-artifact@v7      # this run's logs, for the guide job
        if: always()
        with: { name: logs-spring, path: spring/logs }
      - name: Publish logs to the ci-logs-spring branch
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs-spring && git rm -rqf --cached .. && git add -f logs && git commit -qm "Spring logs ${GITHUB_SHA::7}" && git push -fq origin ci-logs-spring

  extras:
    runs-on: ubuntu-latest
    defaults: { run: { shell: 'bash -eo pipefail {0}' } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mkdir -p logs
      - name: Install Chromium for Playwright
        working-directory: extras
        run: mvn -B -ntp -q test-compile exec:java -Dexec.classpathScope=test -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"
      - name: Legacy, Kafka, extensions, logs/metrics, AWS + Azure
        working-directory: extras
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: mvn -B -ntp verify 2>&1 | tee ../logs/extras-verify.log
      - name: Contract test against a breaking provider change
        if: always()
        continue-on-error: true            # expected to fail
        working-directory: extras
        run: mvn -B -ntp failsafe:integration-test failsafe:verify -Dit.test=OrderStatusProviderPactIT -Dorders.v2=true 2>&1 | tee ../logs/pact-breaking.log
      - name: Mock auth server (in-process and container)
        if: always()
        working-directory: spring-auth
        run: mvn -B -ntp verify 2>&1 | tee ../logs/auth-verify.log
      - name: Collect reports
        if: always()
        run: |
          cp extras/target/*.png extras/target/pacts/*.json logs/ 2>/dev/null || true
          ls -la extras/target/*-trace.zip > logs/traces.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v7      # this run's logs, for the guide job
        if: always()
        with: { name: logs-extras, path: logs }
      - name: Publish logs to the ci-logs-extras branch
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs-extras && git rm -rqf --cached . && git add -f logs && git commit -qm "Extras logs ${GITHUB_SHA::7}" && git push -fq origin ci-logs-extras

  shard:
    runs-on: ubuntu-latest
    strategy:
      matrix: { shard: [1, 2] }       # two machines, half the classes each
    defaults: { run: { shell: 'bash -eo pipefail {0}' } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v6
      - name: Run this shard's test classes
        run: |
          mkdir -p logs
          classes=$(cd src/test/java && find . -name '*Test.java' \
            | sed 's#^./##; s#.java$##; s#/#.#g' | sort \
            | awk -v n=2 -v k=${{ matrix.shard }} 'NR % n == k % n')
          echo "shard ${{ matrix.shard }}/2: $(echo $classes | wc -w) classes" | tee logs/shard.log
          ./gradlew --console=plain test $(printf -- '--tests %s ' $classes) 2>&1 | tail -3 | tee -a logs/shard.log
          python3 - <<'PY' | tee -a logs/shard.log
          import glob, xml.etree.ElementTree as ET
          n = sum(int(ET.parse(f).getroot().get("tests")) for f in glob.glob("build/test-results/test/*.xml"))
          print(f"tests run in this shard: {n}")
          PY
      - uses: actions/upload-artifact@v7      # this run's logs, for the guide job
        if: always()
        with: { name: "logs-shard-${{ matrix.shard }}", path: logs }
      - name: Publish logs to the ci-logs-shard-N branch
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs-shard-${{ matrix.shard }} && git rm -rqf --cached . && git add -f logs && git commit -qm "Shard logs ${GITHUB_SHA::7}" && git push -fq origin ci-logs-shard-${{ matrix.shard }}

  ops:                                # caches, scheduled + batch jobs, flags, synthetic checks, jcstress
    runs-on: ubuntu-latest
    defaults: { run: { shell: 'bash -eo pipefail {0}' } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mkdir -p logs
      - name: Redis cache, scheduled job, Spring Batch, feature flags, synthetic check
        working-directory: spring-ops
        run: |
          mvn -B -ntp verify 2>&1 | tee ../logs/ops-verify.log
          grep -h "\[async writes\]" ../logs/ops-verify.log | tee ../logs/cache-async.log
      - name: Synthetic check against the running app, then with Redis down
        run: |
          docker run -d --name redis -p 6379:6379 redis:8-alpine
          java -jar spring-ops/target/shop-ops-1.0.jar > logs/app.log 2>&1 &
          for i in $(seq 60); do curl -sf localhost:8080/actuator/health >/dev/null && break; sleep 1; done
          check() {   # check <log>: run the synthetic check, keep its output and exit code
            rc=0; java -cp spring-ops/target/classes shop.synthetic.SyntheticCheck http://localhost:8080 > out.txt 2>&1 || rc=$?
            cat out.txt | tee -a "$1"; echo "exit code $rc" | tee -a "$1"; return $rc
          }
          echo '$ java -cp target/classes shop.synthetic.SyntheticCheck http://localhost:8080' | tee logs/synthetic.log
          check logs/synthetic.log                       # must pass
          docker stop redis
          echo '$ docker stop redis; java -cp … SyntheticCheck http://localhost:8080' | tee logs/synthetic-redis-down.log
          if check logs/synthetic-redis-down.log; then echo 'expected the check to fail'; exit 1; fi
      - name: jcstress - the racy counter and the atomic one
        working-directory: concurrency
        run: |
          nproc | tee ../logs/jcstress-nproc.txt
          mvn -B -ntp compile exec:exec 2>&1 | tee ../logs/jcstress.log
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: logs-ops, path: logs }
      - name: Publish logs to the ci-logs-ops branch
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs-ops && git rm -rqf --cached . && git add -f logs && git commit -qm "Ops logs ${GITHUB_SHA::7}" && git push -fq origin ci-logs-ops

  deepdive:                           # the experiments behind the deep-dive book
    runs-on: ubuntu-latest
    defaults: { run: { shell: 'bash -eo pipefail {0}' } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: command -v tcpdump || (sudo apt-get update -q && sudo apt-get install -yq tcpdump)
      - name: Run every experiment
        run: bash deepdive/run.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: logs-deepdive, path: logs }
      - name: Publish logs to the ci-logs-deepdive branch
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs-deepdive && git rm -rqf --cached . && git add -f logs && git commit -qm "Deep-dive logs ${GITHUB_SHA::7}" && git push -fq origin ci-logs-deepdive

  guide:                              # rebuilds the PDF from this run's outputs
    needs: [maven, gradle, spring, extras, shard, ops, deepdive]
    runs-on: ubuntu-latest
    concurrency: { group: guide, cancel-in-progress: false }
    defaults: { run: { shell: 'bash -eo pipefail {0}' } }
    env: { LANG: C.UTF-8, LC_ALL: C.UTF-8 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Tools for the builder
        run: |
          python3 -m venv .venv && echo "$PWD/.venv/bin" >> $GITHUB_PATH
          .venv/bin/pip install -q playwright==1.56.0 pypdf pillow
          .venv/bin/python -m playwright install --with-deps chromium
          cd guide && npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with: { pattern: logs-*, path: ci-artifacts }
      - name: Workspace - code, scripts, CI logs from this run
        run: bash guide/assemble.sh ci-artifacts
      - name: The tools the guide recommends resolve at the stated versions
        run: |
          mvn -B -ntp -q -f guide/catalogue/pom.xml dependency:resolve dependency:resolve-plugins
          ./gradlew --console=plain -p guide/catalogue help
      - name: Re-run every hand-run example
        working-directory: guide/java
        run: mkdir -p ../../guide-logs && bash regenerate.sh 2>&1 | tee ../../guide-logs/regenerate.log
      - name: Build the PDF and check it
        working-directory: guide
        run: |
          { python shots.py
            python build.py
            python render.py            # fails on any layout overflow
            python contrast.py          # fails on any WCAG AA contrast problem
            python claims.py            # fails if an output no longer says what the text says
            python pdfcheck.py          # tagged, language set, fonts embedded
            python check_versions.py    # every version in the text is the one the builds use
            python standalone.py        # one-file HTML: fonts and images inlined
          } 2>&1 | tee ../guide-logs/guide-build.log
      - uses: actions/upload-artifact@v7
        with: { name: Testing-Field-Guide, path: "guide/Testing-Field-Guide.*" }
      - name: Publish to docs/
        if: github.ref == 'refs/heads/main'
        run: |
          cp guide/Testing-Field-Guide.pdf guide/Testing-Field-Guide.html docs/
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git add docs/Testing-Field-Guide.pdf docs/Testing-Field-Guide.html guide/img   # screenshots are regenerated too
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -qm "Rebuild the guide (PDF and HTML) from run ${GITHUB_RUN_NUMBER} [skip ci]"
          git pull -q --rebase --autostash origin main && git push -q origin HEAD:main
      - name: Publish the guide log to the ci-logs-guide branch    # last: it leaves main
        if: always() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p guide-logs && cp guide/java/*-output*.txt guide/java/*.csv guide-logs/ 2>/dev/null || true
          cp guide/Testing-Field-Guide.pdf guide-logs/ 2>/dev/null || true     # also when a check failed
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout -q --orphan ci-logs-guide && git rm -rqf --cached . && git add -f guide-logs && git commit -qm "Guide logs ${GITHUB_SHA::7}" && git push -fq origin ci-logs-guide
