name: build
on: [push, workflow_dispatch]

jobs:
  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Unit (threads) + integration (forks) + coverage
        run: mvn -B -ntp verify
      - name: Copy-paste detection, tests included
        continue-on-error: true      # expected to find duplicates
        run: mvn -B -ntp pmd:cpd-check
      - name: Mutation testing + duplicate-test finder
        run: mvn -B -ntp test-compile pitest:mutationCoverage exec:java
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maven-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
            target/pit-reports/
            target/cpd.xml

  gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit (threads) + integration (forks) + coverage
        run: ./gradlew --console=plain test integrationTest jacocoTestReport
      - name: Copy-paste detection, tests included
        continue-on-error: true      # expected to find duplicates
        run: ./gradlew --console=plain cpdCheck
      - name: Mutation testing + duplicate-test finder
        run: ./gradlew --console=plain pitest findRedundantTests
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gradle-reports
          path: build/reports/
